name: Release Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to tag the release with, e.g., 1.2.0, 1.2.1-alpha.1
        required: true
      aws_region:
        description: 'Deploy lambda layer to aws regions'
        required: true
        default: 'us-east-1, us-east-2, us-west-1, us-west-2, ap-south-1, ap-northeast-3, ap-northeast-2, ap-southeast-1, ap-southeast-2, ap-northeast-1, ca-central-1, eu-central-1, eu-west-1, eu-west-2, eu-west-3, eu-north-1, sa-east-1, af-south-1, ap-east-1, ap-east-2, ap-south-2, ap-southeast-3, ap-southeast-4, ap-southeast-6, eu-central-2, eu-south-1, eu-south-2, il-central-1, me-central-1, ap-southeast-5, ap-southeast-7, mx-central-1, ca-west-1, cn-north-1, cn-northwest-1'
      dry_run:
        description: 'Dry run: build, test, validate Maven Central in staging (then drop it) and build the image. Publishes nothing.'
        type: boolean
        default: false

env:
  AWS_PUBLIC_ECR_REGION: us-east-1
  AWS_PRIVATE_ECR_REGION: us-west-2
  TEST_TAG: public.ecr.aws/aws-observability/adot-autoinstrumentation-java:test-v2
  PUBLIC_REPOSITORY: public.ecr.aws/aws-observability/adot-autoinstrumentation-java
  PRIVATE_REPOSITORY: 020628701572.dkr.ecr.us-west-2.amazonaws.com/adot-autoinstrumentation-java
  PRIVATE_REGISTRY: 020628701572.dkr.ecr.us-west-2.amazonaws.com
  ARTIFACT_NAME: aws-opentelemetry-agent.jar
  LAYER_ARTIFACT_NAME: aws-opentelemetry-java-layer.zip
  # Legacy list of commercial regions to deploy to. New regions should NOT be added here, and instead should be added to the `aws_region` default input to the workflow.
  LEGACY_COMMERCIAL_REGIONS: us-east-1, us-east-2, us-west-1, us-west-2, ap-south-1, ap-northeast-3, ap-northeast-2, ap-southeast-1, ap-southeast-2, ap-northeast-1, ca-central-1, eu-central-1, eu-west-1, eu-west-2, eu-west-3, eu-north-1, sa-east-1
  LAYER_NAME: AWSOpenTelemetryDistroJava
  VERSION: ${{ github.event.inputs.version }}
  AWS_REGION: ${{ github.event.inputs.aws_region }}
  DRY_RUN: ${{ inputs.dry_run }}
  IMAGE_ARCHIVE_NAME: adot-image-oci.tar
  # crane pushes the OCI archive built in build-sdk. Pinned by version and SHA256 of the release tarball.
  CRANE_VERSION: v0.22.1
  CRANE_SHA256: 0ab7a1d6932a213aed964ce97666c3077fe691c8606413674a8b3e0b9ec4cda0

permissions:
  id-token: write
  contents: write

# Never run two releases (or a release and a dry run) at the same time.
concurrency:
  group: release-build
  cancel-in-progress: false

jobs:
  # Phase 1: build-sdk does everything that builds, tests or stages, and nothing public.
  # It builds the SDK ONCE, validates the Maven Central deployment in staging, and builds the
  # multi-arch image ONCE as an OCI archive that publish-sdk pushes unchanged.
  build-sdk:
    environment: Release
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    outputs:
      tag_exists: ${{ steps.release-state.outputs.tag_exists }}
      maven_published: ${{ steps.release-state.outputs.maven_published }}
      public_ecr_exists: ${{ steps.release-state.outputs.public_ecr_exists }}
      repository_key: ${{ steps.maven-stage.outputs.repository_key }}
      deployment_id: ${{ steps.maven-stage.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Check main build status
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          WORKFLOW_ID=$(gh api "repos/$REPOSITORY/actions/workflows" --jq '.workflows[] | select(.name=="Java Agent Main Build") | .id')
          # Require a successful main build for this exact commit, not just the latest run on the branch.
          LATEST_RUN=$(gh api "repos/$REPOSITORY/actions/workflows/$WORKFLOW_ID/runs?head_sha=$SHA" --jq '.workflow_runs | sort_by(.created_at) | .[-1] | {conclusion, status}')
          STATUS=$(echo "$LATEST_RUN" | jq -r '.status')
          CONCLUSION=$(echo "$LATEST_RUN" | jq -r '.conclusion')

          if [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "queued" ]; then
            echo "Main build for $SHA is still running (status: $STATUS). Cannot proceed with release."
            exit 1
          elif [ "$CONCLUSION" != "success" ]; then
            echo "Main build for $SHA conclusion: $CONCLUSION"
            exit 1
          fi
          echo "Main build succeeded for $SHA, proceeding with release"

      # Read-only. Lets publish-sdk skip anything already published, so a retry never overwrites a
      # published ECR tag and never re-runs Maven Central or the git tag.
      # The private ECR repository is checked in publish-sdk, which already assumes the release role.
      - name: Check release state
        id: release-state
        run: |
          set +e
          git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" > /dev/null
          TAG_RC=$?
          .github/scripts/maven-central-deployment.sh is-published "$VERSION"
          MAVEN_RC=$?
          set -e
          case "$TAG_RC" in 0) TAG_EXISTS=true ;; 2) TAG_EXISTS=false ;; *) echo "::error::Could not check git tag v${VERSION}"; exit 1 ;; esac
          case "$MAVEN_RC" in 0) MAVEN_PUBLISHED=true ;; 1) MAVEN_PUBLISHED=false ;; *) echo "::error::Could not check Maven Central for ${VERSION}"; exit 1 ;; esac
          PUBLIC_ECR_EXISTS=$(.github/scripts/ecr-tag-exists.sh public "v${VERSION}")

          if [ "$TAG_EXISTS" = true ] && [ "$MAVEN_PUBLISHED" = true ] && [ "$PUBLIC_ECR_EXISTS" = true ]; then
            echo "::error::v${VERSION} is already released (git tag, Maven Central and public ECR all exist)."
            exit 1
          fi
          if [ "$MAVEN_PUBLISHED" = true ]; then echo "::warning::${VERSION} is already on Maven Central; Maven staging and publishing will be skipped."; fi
          if [ "$TAG_EXISTS" = true ]; then echo "::warning::Git tag v${VERSION} already exists; the tag push will be skipped."; fi
          if [ "$PUBLIC_ECR_EXISTS" = true ]; then echo "::warning::${PUBLIC_REPOSITORY}:v${VERSION} already exists; the image push will be skipped."; fi
          {
            echo "tag_exists=${TAG_EXISTS}"
            echo "maven_published=${MAVEN_PUBLISHED}"
            echo "public_ecr_exists=${PUBLIC_ECR_EXISTS}"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version-file: .java-version
          distribution: 'temurin'
      - uses: gradle/actions/wrapper-validation@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Publish patched dependencies to maven local
        uses: ./.github/actions/patch-dependencies
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg_password: ${{ secrets.GPG_PASSPHRASE }}

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #v5.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN }}
          aws-region: ${{ env.AWS_PUBLIC_ECR_REGION }}

      - name: Log in to AWS ECR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          registry: public.ecr.aws

      # The only SDK build of the release. Its jar goes to Maven Central, into the image and to the GitHub release.
      - name: Build release with Gradle
        uses: gradle/actions/setup-gradle@d9c87d481d55275bb5441eef3fe0e46805f9ef70 #v3.5.0
        with:
          arguments: build integrationTests -PlocalDocker=true -Prelease.version=${{ env.VERSION }} --stacktrace

      - name: Upload SDK artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: otelagent/build/libs/aws-opentelemetry-agent-${{ env.VERSION }}.jar

      # Nebula refused to tag a dirty tree in v2.28.2. publish-sdk now tags with plain git, so this is a
      # warning only: it surfaces unexpected build output without blocking the release.
      - name: Check working tree is clean
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::warning::The working tree has untracked or modified files after the build."
          fi

      # Signs and uploads to the OSSRH staging repository, then uploads it to the Central Portal as
      # USER_MANAGED and waits for VALIDATED. Nothing is published here; publish-sdk publishes it.
      # publishToSonatype and stage must run on the same runner (the staging search is scoped to the runner IP).
      - name: Stage and validate Maven Central deployment
        id: maven-stage
        if: steps.release-state.outputs.maven_published != 'true'
        env:
          PUBLISH_TOKEN_USERNAME: ${{ secrets.PUBLISH_TOKEN_USERNAME }}
          PUBLISH_TOKEN_PASSWORD: ${{ secrets.PUBLISH_TOKEN_PASSWORD }}
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          for attempt in 1 2; do
            ./gradlew publishToSonatype -Prelease.version="$VERSION" --stacktrace
            STAGE_OUTPUT="$(mktemp)"
            set +e
            GITHUB_OUTPUT="$STAGE_OUTPUT" .github/scripts/maven-central-deployment.sh stage "$VERSION"
            rc=$?
            set -e
            if [ "$rc" -eq 0 ]; then
              cat "$STAGE_OUTPUT" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            if [ "$rc" -eq 3 ] && [ "$attempt" -eq 1 ]; then
              # The keyserver lookup is often transient (v2.33.0 passed ~4 h later with the same key).
              KEY="$(sed -n 's/^repository_key=//p' "$STAGE_OUTPUT")"
              echo "::warning::GPG public key not found during validation; dropping staging repository ${KEY} and retrying once in 120 s."
              if [ -n "$KEY" ]; then .github/scripts/maven-central-deployment.sh drop "$KEY" || true; fi
              sleep 120
              continue
            fi
            cat "$STAGE_OUTPUT" >> "$GITHUB_OUTPUT"
            exit "$rc"
          done

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 #3.6.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 #v3.11.1
        with:
          driver-opts: image=moby/buildkit:v0.15.1

      # The release image, built once for both platforms. publish-sdk pushes this exact archive.
      - name: Build release image (OCI archive)
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          push: false
          build-args: "ADOT_JAVA_VERSION=${{ env.VERSION }}"
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.PUBLIC_REPOSITORY }}:v${{ env.VERSION }}
          outputs: type=oci,dest=${{ runner.temp }}/${{ env.IMAGE_ARCHIVE_NAME }}

      # Same Dockerfile, context and build args on the same builder, so the layers come from the build cache above.
      - name: Build image for testing
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 #v6.18.0
        with:
          push: false
          build-args: "ADOT_JAVA_VERSION=${{ env.VERSION }}"
          context: .
          platforms: linux/amd64
          tags: ${{ env.TEST_TAG }}
          load: true

      - name: Test docker image
        shell: bash
        run: .github/scripts/test-adot-javaagent-image.sh "${{ env.TEST_TAG }}" "$VERSION"

      # Installs the pinned tools publish-sdk uses, so a dry run catches a broken download or checksum.
      - name: Install pinned crane
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          "$RUNNER_TEMP/crane" version
          # Lists the archive contents: one image index with both platforms (and attestations).
          mkdir -p "$RUNNER_TEMP/oci-layout"
          tar -xf "$RUNNER_TEMP/$IMAGE_ARCHIVE_NAME" -C "$RUNNER_TEMP/oci-layout"
          jq . "$RUNNER_TEMP/oci-layout/index.json"

      - name: Set up notation CLI
        uses: notaryproject/notation-action/setup@b6fee73110795d6793253c673bd723f12bcf9bbb # notation-action v1.2.2
        with:
          url: https://github.com/notaryproject/notation/releases/download/v1.3.2/notation_1.3.2_linux_amd64.tar.gz
          checksum: e1a0f060308086bf8020b2d31defb7c5348f133ca0dba6a1a7820ef3cbb6dfe5

      - name: Upload image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: ${{ env.IMAGE_ARCHIVE_NAME }}
          path: ${{ runner.temp }}/${{ env.IMAGE_ARCHIVE_NAME }}

      # A dry run never publishes, so drop the staged deployment. Also drop it if this job fails after staging,
      # because publish-sdk will not run.
      - name: Drop staged Maven Central deployment
        if: ${{ always() && steps.maven-stage.outputs.repository_key != '' && (inputs.dry_run || failure() || cancelled()) }}
        env:
          PUBLISH_TOKEN_USERNAME: ${{ secrets.PUBLISH_TOKEN_USERNAME }}
          PUBLISH_TOKEN_PASSWORD: ${{ secrets.PUBLISH_TOKEN_PASSWORD }}
          REPOSITORY_KEY: ${{ steps.maven-stage.outputs.repository_key }}
          DEPLOYMENT_ID: ${{ steps.maven-stage.outputs.deployment_id }}
        run: .github/scripts/maven-central-deployment.sh drop "$REPOSITORY_KEY" "$DEPLOYMENT_ID"

  build-layer:
    needs: build-sdk
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    outputs:
      aws_regions_json: ${{ steps.set-matrix.outputs.aws_regions_json }}
    steps:
      - name: Set up regions matrix
        id: set-matrix
        env:
          AWS_REGIONS: ${{ env.AWS_REGION }}
        run: |
          IFS=',' read -ra REGIONS <<< "$AWS_REGIONS"
          MATRIX="["
          for region in "${REGIONS[@]}"; do
            trimmed_region=$(echo "$region" | xargs)
            MATRIX+="\"$trimmed_region\","
          done
          MATRIX="${MATRIX%,}]"
          echo ${MATRIX}
          echo "aws_regions_json=${MATRIX}" >> $GITHUB_OUTPUT

      - name: Checkout Repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version-file: .java-version
          distribution: 'temurin'

      - name: Build layers
        working-directory: lambda-layer
        run: |
          ./build-layer.sh

      - name: Upload layer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: layer.zip
          path: lambda-layer/build/distributions/${{ env.LAYER_ARTIFACT_NAME }}

  # Phase 1: publish-sdk only does production writes, in this order: ECR image -> private platform tags ->
  # ECR signature -> Maven Central -> git tag. Each write is skipped if it is already done, so the job can be
  # re-run after a partial failure without editing the workflow.
  publish-sdk:
    if: ${{ !inputs.dry_run }}
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    needs: [build-sdk, build-layer]
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0

      - name: Download image artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
        with:
          name: ${{ env.IMAGE_ARCHIVE_NAME }}
          path: ${{ runner.temp }}

      - name: Install pinned crane
        run: |
          curl -fsSL -o "$RUNNER_TEMP/crane.tar.gz" "https://github.com/google/go-containerregistry/releases/download/${CRANE_VERSION}/go-containerregistry_Linux_x86_64.tar.gz"
          echo "${CRANE_SHA256}  $RUNNER_TEMP/crane.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/crane.tar.gz" -C "$RUNNER_TEMP" crane
          mkdir -p "$RUNNER_TEMP/oci-layout"
          tar -xf "$RUNNER_TEMP/$IMAGE_ARCHIVE_NAME" -C "$RUNNER_TEMP/oci-layout"

      - name: Configure AWS Credentials for public ECR
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #v5.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN_RELEASE }}
          aws-region: ${{ env.AWS_PUBLIC_ECR_REGION }}

      - name: Log in to AWS public ECR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          registry: public.ecr.aws

      - name: Configure AWS Credentials for Private ECR
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #v5.0.0
        with:
          role-to-assume: ${{ secrets.AWS_ASSUME_ROLE_ARN_RELEASE }}
          aws-region: ${{ env.AWS_PRIVATE_ECR_REGION }}

      - name: Log in to AWS private ECR
        uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1 #v3.5.0
        with:
          registry: ${{ env.PRIVATE_REGISTRY }}

      - name: Check for existing images in ECR
        id: ecr-check
        env:
          PUBLIC_EXISTS: ${{ needs.build-sdk.outputs.public_ecr_exists }}
        run: |
          PUBLIC=$(.github/scripts/ecr-tag-exists.sh public "v${VERSION}")
          PRIVATE=$(.github/scripts/ecr-tag-exists.sh private "v${VERSION}")
          if [ "$PUBLIC" != "$PRIVATE" ]; then
            echo "::error::v${VERSION} exists in only one ECR repository (public=${PUBLIC}, private=${PRIVATE}). Resolve manually before retrying."
            exit 1
          fi
          if [ "$PUBLIC" = true ]; then
            echo "::warning::v${VERSION} already exists in public and private ECR; skipping the image push (build-sdk saw public=${PUBLIC_EXISTS})."
          fi
          echo "exists=${PUBLIC}" >> "$GITHUB_OUTPUT"

      # Pushes the exact multi-arch archive that build-sdk built and tested. Never overwrites a published tag.
      - name: Push image to public and private ECR
        if: steps.ecr-check.outputs.exists != 'true'
        run: |
          "$RUNNER_TEMP/crane" push "$RUNNER_TEMP/oci-layout" "${PUBLIC_REPOSITORY}:v${VERSION}"
          "$RUNNER_TEMP/crane" push "$RUNNER_TEMP/oci-layout" "${PRIVATE_REPOSITORY}:v${VERSION}"
          "$RUNNER_TEMP/crane" digest "${PUBLIC_REPOSITORY}:v${VERSION}"
          "$RUNNER_TEMP/crane" digest "${PRIVATE_REPOSITORY}:v${VERSION}"

      - name: Tag platform images in private ECR
        env:
          REPO_NAME: adot-autoinstrumentation-java
        run: |
          VERSION="${{ env.VERSION }}"
          REGION="${{ env.AWS_PRIVATE_ECR_REGION }}"
          # Idempotent: re-tagging an image with the same tag and manifest is treated as success.
          put_image() {
            if ! OUT=$(aws ecr put-image --repository-name "${REPO_NAME}" --image-tag "$1" --image-manifest "$2" --region "${REGION}" 2>&1 > /dev/null); then
              if echo "$OUT" | grep -q ImageAlreadyExistsException; then
                echo "$1 already tagged"
              else
                echo "$OUT"
                return 1
              fi
            fi
          }
          # Read the manifest index for the multi-arch tag
          MANIFEST_INDEX=$(aws ecr batch-get-image \
            --repository-name "${REPO_NAME}" \
            --image-ids imageTag="v${VERSION}" \
            --region "${REGION}" \
            --query 'images[0].imageManifest' \
            --output text)

          # Tag platform images (amd64, arm64) with v$VERSION-$arch
          for arch in amd64 arm64; do
            DIGEST=$(echo "$MANIFEST_INDEX" | jq -r ".manifests[] | select(.platform.architecture==\"${arch}\") | .digest")
            if [ -z "$DIGEST" ] || [ "$DIGEST" = "null" ]; then
              echo "No ${arch} image found in manifest index, skipping"
              continue
            fi
            MANIFEST=$(aws ecr batch-get-image \
              --repository-name "${REPO_NAME}" \
              --image-ids imageDigest="${DIGEST}" \
              --region "${REGION}" \
              --query 'images[0].imageManifest' \
              --output text)
            put_image "v${VERSION}-${arch}" "$MANIFEST"
            echo "Tagged ${DIGEST} as v${VERSION}-${arch}"
          done

          # Tag attestation manifests (architecture=unknown) with their sha hex
          for DIGEST in $(echo "$MANIFEST_INDEX" | jq -r '.manifests[] | select(.platform.architecture=="unknown") | .digest'); do
            SHA_HEX="${DIGEST#sha256:}"
            MANIFEST=$(aws ecr batch-get-image \
              --repository-name "${REPO_NAME}" \
              --image-ids imageDigest="${DIGEST}" \
              --region "${REGION}" \
              --query 'images[0].imageManifest' \
              --output text)
            put_image "${SHA_HEX}" "$MANIFEST"
            echo "Tagged ${DIGEST} as ${SHA_HEX} (attestation)"
          done

      # Signing is required: a missing profile or a failed signature fails the release (previously best effort,
      # which left four public tags unsigned). Re-running adds another signature, which is harmless.
      - name: Set up notation CLI
        uses: notaryproject/notation-action/setup@b6fee73110795d6793253c673bd723f12bcf9bbb # notation-action v1.2.2
        with:
          url: https://github.com/notaryproject/notation/releases/download/v1.3.2/notation_1.3.2_linux_amd64.tar.gz
          checksum: e1a0f060308086bf8020b2d31defb7c5348f133ca0dba6a1a7820ef3cbb6dfe5

      - name: Query ECR Signing Profile ARN
        id: ecr-signing-profile
        run: |
          PROFILE_ARN=$(aws signer get-signing-profile --region ${{ env.AWS_PUBLIC_ECR_REGION }} --profile-name ADOTECRSigningProfile --query "arn" --output text)
          echo "profile_arn=$PROFILE_ARN" >> "$GITHUB_OUTPUT"
          echo "Found ECR signing profile: $PROFILE_ARN"

      # The AWS Signer plugin (v1.0.2292) is only published at a "latest" URL, so it is pinned by its SHA256 checksum.
      # force_referrers_tag: 'false' stores the signature via the OCI Referrers API instead of a "sha256-<digest>" tag.
      - name: Sign public ECR image
        uses: notaryproject/notation-action/sign@b6fee73110795d6793253c673bd723f12bcf9bbb # notation-action v1.2.2
        with:
          plugin_name: com.amazonaws.signer.notation.plugin
          plugin_url: https://d2hvyiie56hcat.cloudfront.net/linux/amd64/plugin/latest/notation-aws-signer-plugin.zip
          plugin_checksum: f8efa548932edc4851f4ba464496994bad753cdf21cd32baa575f7291a26c7b9
          key_id: ${{ steps.ecr-signing-profile.outputs.profile_arn }}
          target_artifact_reference: ${{ env.PUBLIC_REPOSITORY }}:v${{ env.VERSION }}
          force_referrers_tag: 'false'

      - name: Publish Maven Central deployment
        id: maven-publish
        if: needs.build-sdk.outputs.maven_published != 'true'
        env:
          PUBLISH_TOKEN_USERNAME: ${{ secrets.PUBLISH_TOKEN_USERNAME }}
          PUBLISH_TOKEN_PASSWORD: ${{ secrets.PUBLISH_TOKEN_PASSWORD }}
          DEPLOYMENT_ID: ${{ needs.build-sdk.outputs.deployment_id }}
        run: .github/scripts/maven-central-deployment.sh publish "$DEPLOYMENT_ID"

      # Plain git instead of Nebula `final`: in this build `release` depends on assemble and check, so `final`
      # would rebuild and re-test the SDK. The tag format matches earlier releases ("Release of X.Y.Z").
      - name: Push git tag v${{ env.VERSION }}
        if: needs.build-sdk.outputs.tag_exists != 'true'
        env:
          SHA: ${{ github.sha }}
        run: |
          git -c user.name="ADOT Patch workflow" -c user.email="adot-patch-workflow@github.com" \
            tag -a "v${VERSION}" -m "Release of ${VERSION}" "$SHA"
          git push origin "refs/tags/v${VERSION}"

      # A tag push can be rejected without failing the job (seen in the v2.28.2 retry). Verify it.
      - name: Verify git tag v${{ env.VERSION }}
        env:
          SHA: ${{ github.sha }}
        run: |
          TAGGED=$(git ls-remote --tags origin "refs/tags/v${VERSION}^{}" | cut -f1)
          [ -n "$TAGGED" ] || TAGGED=$(git ls-remote --tags origin "refs/tags/v${VERSION}" | cut -f1)
          if [ "$TAGGED" != "$SHA" ]; then
            echo "::error::Tag v${VERSION} points at '${TAGGED}', expected ${SHA}."
            exit 1
          fi
          echo "Tag v${VERSION} points at ${SHA}"

      # Covers a failure or cancel inside this job before the Maven Central publish.
      - name: Drop unpublished Maven Central deployment
        if: ${{ always() && needs.build-sdk.outputs.repository_key != '' && steps.maven-publish.outcome != 'success' }}
        env:
          PUBLISH_TOKEN_USERNAME: ${{ secrets.PUBLISH_TOKEN_USERNAME }}
          PUBLISH_TOKEN_PASSWORD: ${{ secrets.PUBLISH_TOKEN_PASSWORD }}
          REPOSITORY_KEY: ${{ needs.build-sdk.outputs.repository_key }}
          DEPLOYMENT_ID: ${{ needs.build-sdk.outputs.deployment_id }}
        run: .github/scripts/maven-central-deployment.sh drop "$REPOSITORY_KEY" "$DEPLOYMENT_ID"

  publish-layer-prod:
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    needs: [build-layer, publish-sdk]
    if: ${{ !inputs.dry_run }}
    strategy:
      matrix:
        aws_region: ${{ fromJson(needs.build-layer.outputs.aws_regions_json) }}
    steps:
      - name: role arn
        env:
          LEGACY_COMMERCIAL_REGIONS: ${{ env.LEGACY_COMMERCIAL_REGIONS }}
        run: |
          LEGACY_COMMERCIAL_REGIONS_ARRAY=(${LEGACY_COMMERCIAL_REGIONS//,/ })
          FOUND=false
          for REGION in "${LEGACY_COMMERCIAL_REGIONS_ARRAY[@]}"; do
            if [[ "$REGION" == "${{ matrix.aws_region }}" ]]; then
              FOUND=true
              break
            fi
          done
          if [ "$FOUND" = true ]; then
            echo "Found ${{ matrix.aws_region }} in LEGACY_COMMERCIAL_REGIONS"
            SECRET_KEY="LAMBDA_LAYER_RELEASE"
          else
            echo "Not found ${{ matrix.aws_region }} in LEGACY_COMMERCIAL_REGIONS"
            SECRET_KEY="${{ matrix.aws_region }}_LAMBDA_LAYER_RELEASE"
          fi
          SECRET_KEY=${SECRET_KEY//-/_}
          echo "SECRET_KEY=${SECRET_KEY}" >> $GITHUB_ENV

      - uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #v5.0.0
        with:
          role-to-assume: ${{ secrets[env.SECRET_KEY] }}
          role-duration-seconds: 1200
          aws-region: ${{ matrix.aws_region }}

      - name: Get s3 bucket name for release
        run: |
          echo BUCKET_NAME=java-lambda-layer-${{ github.run_id }}-${{ matrix.aws_region }} | tee --append $GITHUB_ENV

      - name: download layer.zip
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
        with:
          name: layer.zip

      - name: Upload to S3 and Sign
        continue-on-error: true
        run: |
          aws s3 mb s3://${{ env.BUCKET_NAME }}
          aws s3 cp ${{ env.LAYER_ARTIFACT_NAME }} s3://${{ env.BUCKET_NAME }}
          
          # Sign the layer
          echo "Checking for signing profile..."
          PROFILE=$(aws signer list-signing-profiles --query "profiles[?profileName=='ADOTLambdaLayerSigningProfile'].arn" --output text 2>/dev/null)
          [ -z "$PROFILE" ] && echo "No signing profile found, skipping" && exit 0
          
          echo "Starting signing job..."
          JOB_ID=$(aws signer start-signing-job \
            --source "s3={bucketName=${{ env.BUCKET_NAME }},key=${{ env.LAYER_ARTIFACT_NAME }},version=null}" \
            --destination "s3={bucketName=${{ env.BUCKET_NAME }},prefix=signed-}" \
            --profile-name ADOTLambdaLayerSigningProfile \
            --query 'jobId' --output text 2>/dev/null) || exit 0
          [ -z "$JOB_ID" ] && echo "No job ID returned" && exit 0
          echo "Job ID: $JOB_ID"
          
          echo "Waiting for signing job to complete..."
          aws signer wait successful-signing-job --job-id "$JOB_ID" || exit 0
          echo "Signing completed"
          
          echo "Moving signed layer..."
          SIGNED=$(aws signer describe-signing-job --job-id "$JOB_ID" --query 'signedObject.s3.key' --output text 2>/dev/null)
          echo "SIGNED value: '$SIGNED'"
          if [ -n "$SIGNED" ]; then
            aws s3 mv "s3://${{ env.BUCKET_NAME }}/$SIGNED" "s3://${{ env.BUCKET_NAME }}/${{ env.LAYER_ARTIFACT_NAME }}"
            echo "Signed layer moved successfully"
          else
            echo "No SIGNED value returned, skipping move"
          fi
      
      - name: Publish Layer Version
        run: |
          layerARN=$(
            aws lambda publish-layer-version \
              --layer-name ${{ env.LAYER_NAME }} \
              --content S3Bucket=${{ env.BUCKET_NAME }},S3Key=${{ env.LAYER_ARTIFACT_NAME }} \
              --compatible-runtimes java11 java17 java21 java25 \
              --compatible-architectures "arm64" "x86_64" \
              --license-info "Apache-2.0" \
              --description "AWS Distro of OpenTelemetry Lambda Layer for Java Runtime" \
              --query 'LayerVersionArn' \
              --output text
          )
          echo $layerARN
          echo "LAYER_ARN=${layerARN}" >> $GITHUB_ENV
          mkdir ${{ env.LAYER_NAME }}
          echo $layerARN > ${{ env.LAYER_NAME }}/${{ matrix.aws_region }}
          cat ${{ env.LAYER_NAME }}/${{ matrix.aws_region }}
          
          # Output SigningProfileVersionArn
          aws lambda get-layer-version-by-arn \
            --arn $layerARN \
            --output json | jq -r '.Content.SigningProfileVersionArn'

      - name: public layer
        run: |
          layerVersion=$(
            aws lambda list-layer-versions \
              --layer-name ${{ env.LAYER_NAME }} \
              --query 'max_by(LayerVersions, &Version).Version'
          )
          aws lambda add-layer-version-permission \
            --layer-name ${{ env.LAYER_NAME }} \
            --version-number $layerVersion \
            --principal "*" \
            --statement-id publish \
            --action lambda:GetLayerVersion

      - name: upload layer arn artifact
        if: ${{ success() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 #v4.6.2
        with:
          name: ${{ env.LAYER_NAME }}-${{ matrix.aws_region }}
          path: ${{ env.LAYER_NAME }}/${{ matrix.aws_region }}

      - name: clean s3
        if: always()
        run: |
          aws s3 rb --force s3://${{ env.BUCKET_NAME }}

  generate-lambda-release-note:
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    needs: publish-layer-prod
    if: ${{ !inputs.dry_run }}
    outputs:
      layer-note: ${{ steps.layer-note.outputs.layer-note }}
    steps:
      - name: Checkout Repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd #v3.1.2
      - name: download layerARNs
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
        with:
          pattern: ${{ env.LAYER_NAME }}-*
          path: ${{ env.LAYER_NAME }}
          merge-multiple: true
      - name: show layerARNs
        run: |
          for file in ${{ env.LAYER_NAME }}/*
          do
          echo $file
          cat $file
          done
      - name: generate layer-note
        id: layer-note
        working-directory: ${{ env.LAYER_NAME }}
        run: |
          echo "| Region | Layer ARN |" >> ../layer-note
          echo "|  ----  | ----  |" >> ../layer-note
          for file in *
          do
          read arn < $file
          echo "| " $file " | " $arn " |" >> ../layer-note
          done
          cd ..
          {
            echo "layer-note<<EOF"
            cat layer-note
            echo "EOF"
          } >> $GITHUB_OUTPUT
          cat layer-note
      - name: generate tf layer
        working-directory: ${{ env.LAYER_NAME }}
        run: |
          echo "locals {" >> ../layer_arns.tf
          echo "  sdk_layer_arns = {" >> ../layer_arns.tf
          for file in *
          do
          read arn < $file
          echo "    \""$file"\" = \""$arn"\"" >> ../layer_arns.tf
          done
          cd ..
          echo "  }" >> layer_arns.tf
          echo "}" >> layer_arns.tf
          terraform fmt layer_arns.tf
          cat layer_arns.tf
      - name: generate layer ARN constants for CDK
        working-directory: ${{ env.LAYER_NAME }}
        run: |
          echo "{" > ../layer_cdk
          for file in *; do
            read arn < "$file"
            echo "    \"$file\": \"$arn\"," >> ../layer_cdk
          done
          echo "}" >> ../layer_cdk
          cat ../layer_cdk

  publish-github:
    needs: generate-lambda-release-note
    if: ${{ !inputs.dry_run }}
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    steps:
      - name: Checkout Repo @ SHA - ${{ github.sha }}
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #v5.0.0
      
      - name: Download SDK artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
        with:
          name: ${{ env.ARTIFACT_NAME }}
      
      - name: Download layer.zip artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #v5.0.0
        with:
          name: layer.zip

      - name: Rename artifacts
        run: |
          cp "aws-opentelemetry-agent-${{ env.VERSION }}.jar" ${{ env.ARTIFACT_NAME }}
          cp ${{ env.LAYER_ARTIFACT_NAME }} layer.zip

      # Publish to GitHub releases
      - name: Create GH release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ env.VERSION }}
        run: |
          # Extract versions from dependency files
          OTEL_INSTRUMENTATION_VERSION=$(grep "val otelVersion" dependencyManagement/build.gradle.kts | sed 's/.*= "\([^"]*\)".*/\1/' | sed 's/-adot1//')
          OTEL_CONTRIB_VERSION=$(grep "io.opentelemetry.contrib:opentelemetry-aws-xray" dependencyManagement/build.gradle.kts | sed 's/.*:\([^"]*\)".*/\1/' | sed 's/-adot1//')

          # Extract CHANGELOG entries for this version
          CHANGELOG_ENTRIES=$(python3 -c "
          import re, os
          version = os.environ['VERSION']
          with open('CHANGELOG.md', 'r') as f:
              content = f.read()
          version_pattern = rf'## v{re.escape(version)}.*?\n(.*?)(?=\n## |\Z)'
          version_match = re.search(version_pattern, content, re.DOTALL)
          if version_match:
              entries = version_match.group(1).strip()
              if entries:
                  # Join continuation lines (indented lines) with the previous line
                  joined = re.sub(r'\n  +', ' ', entries)
                  print(joined)
          ")

          # Create release notes
          cat > release_notes.md << EOF
          $(if [ -n "$CHANGELOG_ENTRIES" ]; then echo "## What's Changed"; echo "$CHANGELOG_ENTRIES"; echo ""; fi)

          ## Upstream Components

          - \`OpenTelemetry Java Contrib\` - $OTEL_CONTRIB_VERSION
          - \`Opentelemetry Instrumentation for Java\` - $OTEL_INSTRUMENTATION_VERSION

          ## Release Artifacts

          This release publishes to public ECR and Maven Central.
          * See ADOT Java auto-instrumentation Docker image v$VERSION in our public ECR repository:
          https://gallery.ecr.aws/aws-observability/adot-autoinstrumentation-java
          * See version $VERSION in our Maven Central repository:
          https://central.sonatype.com/artifact/software.amazon.opentelemetry/aws-opentelemetry-agent

          ## Lambda Layer

          This release includes the AWS OpenTelemetry Lambda Layer for Java version $VERSION-$(echo $GITHUB_SHA | cut -c1-7).

          Lambda Layer ARNs:
          ${{ needs.generate-lambda-release-note.outputs.layer-note }}
          EOF

          shasum -a 256 ${{ env.ARTIFACT_NAME }} > ${{ env.ARTIFACT_NAME }}.sha256
          shasum -a 256 layer.zip > layer.zip.sha256

          gh release create --target "$GITHUB_REF_NAME" \
             --title "Release v$VERSION" \
             --notes-file release_notes.md \
             --draft \
             "v$VERSION" \
             ${{ env.ARTIFACT_NAME }} \
             ${{ env.ARTIFACT_NAME }}.sha256 \
             layer.zip \
             layer.zip.sha256

  # Phase 1: signing now happens (required) in publish-sdk. This job keeps its place in the workflow as a
  # read-only check that the released public image has a signature.
  sign-public-ecr-image:
    if: ${{ !inputs.dry_run }}
    runs-on:
      - codebuild-adot-java-runner-${{ github.run_id }}-${{ github.run_attempt }}
      - image:ubuntu-8.0
      - instance-size:large
    needs: publish-github
    steps:
      - name: Set up notation CLI
        uses: notaryproject/notation-action/setup@b6fee73110795d6793253c673bd723f12bcf9bbb # notation-action v1.2.2
        with:
          url: https://github.com/notaryproject/notation/releases/download/v1.3.2/notation_1.3.2_linux_amd64.tar.gz
          checksum: e1a0f060308086bf8020b2d31defb7c5348f133ca0dba6a1a7820ef3cbb6dfe5

      # Lists the signatures attached to the image through the OCI Referrers API (public read, no credentials).
      - name: Verify public ECR image is signed
        run: |
          OUT=$(notation ls "${PUBLIC_REPOSITORY}:v${VERSION}")
          echo "$OUT"
          if ! echo "$OUT" | grep -q "application/vnd.cncf.notary.signature"; then
            echo "::error::${PUBLIC_REPOSITORY}:v${VERSION} has no notation signature."
            exit 1
          fi
