name: CloudWatch Plugin for OpenTelemetry PR Build

# Dedicated PR build for the standalone cloudwatch-plugin-otel module. Path-scoped so it runs ONLY
# when this module changes — changes elsewhere in the repo do not trigger it, and vice versa.
on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
    branches:
      - main
      - "release/v*"
    paths:
      - "cloudwatch-plugin-otel/**"
      - ".github/workflows/cloudwatch-plugin-otel-pr-build.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version-file: .java-version
          distribution: temurin

      - name: Build and run unit tests
        run: ./gradlew build -p cloudwatch-plugin-otel --stacktrace

  compat-tests:
    name: Unit tests (OTel SDK ${{ matrix.otel-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        otel-version: ["1.32.0", "latest"] # minimum supported version and the latest release
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version-file: .java-version
          distribution: temurin

      - name: Run unit tests against pinned OTel SDK
        run: ./gradlew test -p cloudwatch-plugin-otel -PotelTestVersion=${{ matrix.otel-version }} --stacktrace

  contract-tests:
    name: Contract tests (all modes)
    runs-on: ubuntu-latest # provides a Docker daemon for Testcontainers + jib
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          java-version-file: .java-version
          distribution: temurin

      # The contractTests task references ../build/libs/<extension>.jar, so the extension jar must
      # exist before the contract suite runs.
      - name: Build extension jar
        run: ./gradlew jar -p cloudwatch-plugin-otel --stacktrace

      - name: Run contract tests
        run: ./gradlew contractTests -p cloudwatch-plugin-otel/contract-tests --stacktrace
