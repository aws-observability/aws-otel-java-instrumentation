# This is a reusable workflow for running the E2E test for Application Signals.
# It is meant to be called from another workflow.
# Read more about reusable workflows: https://docs.github.com/en/actions/using-workflows/reusing-workflows#overview
name: E2E Testing
on:
  workflow_call:
    inputs:
      adot-image-name:
        required: true
        type: string

permissions:
  id-token: write
  contents: read

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false


jobs:
  upload-main-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 #5.0.0

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@a03048d87541d1d9fcf2ecf528a4a65ba9bd7838 #5.0.0
        with:
          role-to-assume: arn:aws:iam::${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ACCOUNT_ID }}:role/${{ secrets.APPLICATION_SIGNALS_E2E_TEST_ROLE_NAME }}
          aws-region: us-east-1

      - uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 #5.0.0
        with:
          name: aws-opentelemetry-agent.jar

      - name: Upload main-build adot.jar to s3
        run: |
          # Extract artifact suffix using version.gradle.kts
          VERSION=$(awk -F'"' '/val adotVersion = / {print $2}' version.gradle.kts)
          aws s3 cp ./aws-opentelemetry-agent-$VERSION.jar s3://adot-main-build-staging-jar/aws-opentelemetry-agent.jar

  #
  # PACKAGED DISTRIBUTION LANGUAGE VERSION COVERAGE
  # DEFAULT SETTING: {Java Version}, EC2, AMD64, AL2
  #

  default-v8-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '8'
      cpu-architecture: 'x86_64'

  default-v11-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '11'
      cpu-architecture: 'x86_64'

  default-v17-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '17'
      cpu-architecture: 'x86_64'

  default-v21-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '21'
      cpu-architecture: 'x86_64'

  default-v25-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '25'
      cpu-architecture: 'x86_64'

  adot-di:
    needs: [ upload-main-build ]
    strategy:
      fail-fast: false
      matrix:
        java-version: [ '8', '11', '17', '21', '25' ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-adot-di-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: ${{ matrix.java-version }}
      cpu-architecture: 'x86_64'

  java-ec2-adot-sigv4-test:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-adot-sigv4-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'

  java-ec2-adaptive-sampling-test:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-adaptive-sampling-test.yml@main
    secrets: inherit
    with:
      caller-workflow-name: 'main-build'
  #
  # DOCKER DISTRIBUTION LANGUAGE VERSION COVERAGE
  # DEFAULT SETTING: {Java Version}, EKS, AMD64, AL2
  #

  # --- Parallel Java EKS pipeline -------------------------------------------------------------
  # Shape: metric-limiter -> eks-setup -> [eks-v8..v25 + service-events-eks concurrently] -> eks-cleanup
  # metric-limiter runs FIRST, exclusive (it reconfigures the cluster-wide agent drop_threshold and
  # self-manages App Signals, so it can't overlap the parallel jobs). Then eks-setup installs App
  # Signals ONCE so the parallel jobs don't each thrash the install; eks-cleanup tears it down ONCE.

  eks-setup:
    # Runs AFTER metric-limiter, which needs exclusive cluster access for its cluster-wide
    # drop_threshold change. if: always() so a metric-limiter failure orders — but does not skip —
    # the rest of the EKS pipeline; metric-limiter's own always() cleanup leaves the cluster cold.
    needs: [ metric-limiter-v11-amd64 ]
    if: ${{ always() }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/eks-setup-app-signals.yml@java-eks-test-fix
    secrets: inherit
    with:
      test-cluster-name: 'e2e-adot-test'
      aws-region: us-east-1

  # Set the shared cluster-wide operator's java auto-instrumentation image ONCE, so the parallel
  # eks-v* / service-events-eks jobs don't each patch + roll out the singleton operator (which
  # serialized them on one Deployment and pushed them past the run time cap).
  eks-patch-java-operator:
    needs: eks-setup
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-patch-java-operator.yml@java-eks-test-fix
    secrets: inherit
    with:
      test-cluster-name: 'e2e-adot-test'
      aws-region: us-east-1
      adot-image-name: ${{ inputs.adot-image-name }}

  eks-v8-amd64:
    needs: [ eks-setup, eks-patch-java-operator ]
    if: ${{ always() && needs.eks-patch-java-operator.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-parallel-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '8'

  eks-v11-amd64:
    needs: [ eks-setup, eks-patch-java-operator ]
    if: ${{ always() && needs.eks-patch-java-operator.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-parallel-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '11'

  eks-v17-amd64:
    needs: [ eks-setup, eks-patch-java-operator ]
    if: ${{ always() && needs.eks-patch-java-operator.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-parallel-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '17'

  eks-v21-amd64:
    needs: [ eks-setup, eks-patch-java-operator ]
    if: ${{ always() && needs.eks-patch-java-operator.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-parallel-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '21'

  eks-v25-amd64:
    needs: [ eks-setup, eks-patch-java-operator ]
    if: ${{ always() && needs.eks-patch-java-operator.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-parallel-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '25'

  # Tear down cluster-wide App Signals state ONCE, after ALL parallel jobs finish.
  # if: always() so a failed job still triggers teardown; gated on every parallel job (the eks-v*
  # versions AND service-events-eks) so it never runs while one is still using the cluster.
  eks-cleanup:
    if: ${{ always() && needs.eks-setup.result == 'success' }}
    needs: [ eks-setup, eks-v8-amd64, eks-v11-amd64, eks-v17-amd64, eks-v21-amd64, eks-v25-amd64, service-events-eks ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/eks-cleanup-app-signals.yml@java-eks-test-fix
    secrets: inherit
    with:
      test-cluster-name: 'e2e-adot-test'
      aws-region: us-east-1

  #
  # PACKAGED DISTRIBUTION PLATFORM COVERAGE
  # DEFAULT SETTING: Java 11, {Platform}, AMD64, AL2
  #

  asg-v11-amd64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-asg-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '11'

  #
  # DOCKER DISTRIBUTION PLATFORM COVERAGE
  # DEFAULT SETTING: Java 11, {Platform}, AMD64, AL2
  #

  k8s-v11-amd64:
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-k8s-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '11'


  ecs-v11-amd64:
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ecs-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '11'

  #
  # CPU ARCHITECTURE COVERAGE
  # DEFAULT SETTING: Java 11, EC2, {CPU Architecture}, AL2
  #

  default-v11-arm64:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-default-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'
      java-version: '11'
      cpu-architecture: 'arm64'

  #
  # UBUNTU COVERAGE
  # DEFAULT SETTING: Java 11, EC2, AMD64, Ubuntu
  #

  v11-amd64-ubuntu:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-ubuntu-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'

  #
  # Other Functional Test Case
  #

  metric-limiter-v11-amd64:
    # Runs FIRST, exclusive, before eks-setup. This test reconfigures the shared
    # amazon-cloudwatch-observability addon (drop_threshold) cluster-wide and self-installs/tears down
    # App Signals, so it can never overlap the parallel eks-v* jobs. Running it first gives it the cold
    # cluster to itself; eks-setup then waits for it (see eks-setup's needs) and installs App Signals fresh.
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/metric-limiter-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '11'

  java-lambda-test:
    strategy:
      fail-fast: false
      matrix:
        runtime: [ java11, java17, java21, java25 ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-lambda-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      runtime: ${{ matrix.runtime }}
      caller-workflow-name: 'main-build'

  service-events-ec2:
    needs: [ upload-main-build ]
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-ec2-service-events-test.yml@main
    secrets: inherit
    with:
      aws-region: us-east-1
      caller-workflow-name: 'main-build'

  service-events-eks:
    # Runs CONCURRENTLY with the eks-v* version jobs. Uses the parallel SE workflow, which relies on
    # the shared eks-setup install (no per-job App Signals) and binds a distinct NodePort (30110) above
    # the version range (30100-30108), so it can share the cluster with the version jobs. eks-cleanup
    # gates on this job too, so App Signals is not torn down until SE finishes.
    needs: [ eks-setup, eks-patch-java-operator ]
    if: ${{ always() && needs.eks-patch-java-operator.result == 'success' }}
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/java-eks-service-events-parallel-test.yml@java-eks-test-fix
    secrets: inherit
    with:
      aws-region: us-east-1
      test-cluster-name: 'e2e-adot-test'
      adot-image-name: ${{ inputs.adot-image-name }}
      caller-workflow-name: 'main-build'
      java-version: '11'

  # This validation is to ensure that all test workflows relevant to this repo are actually
  # being used in this repo, which is referring to all the other jobs in this file.
  #
  # If this starts failing, then it most likely means that new e2e test workflow was
  # added to `aws-observability/aws-application-signals-test-framework`, but was not
  # added to this file. It could also mean that a test in this file has been removed.
  #
  # If a particular test file is intended to not be tested in this repo and should not
  # be failing this particular validation, then choose one of the following options:
  # - Add the test file to the exclusions input (CSV format) to the workflow
  #   (see: https://github.com/aws-observability/aws-application-signals-test-framework/blob/main/.github/workflows/validate-e2e-tests-are-accounted-for.yml#L1)
  # - Update the `validate-e2e-tests-are-accounted-for` job to change which "workflow files are expected to be used by this repo"
  #   (see: https://github.com/aws-observability/aws-application-signals-test-framework/blob/main/.github/workflows/validate-e2e-tests-are-accounted-for.yml)
  validate-all-tests-are-accounted-for:
    uses: aws-observability/aws-application-signals-test-framework/.github/workflows/validate-e2e-tests-are-accounted-for.yml@main
    with:
      # java-eks-test.yml and java-eks-service-events-test.yml are the sequential monoliths, now
      # replaced by java-eks-parallel-test.yml and java-eks-service-events-parallel-test.yml for this
      # repo's parallel jobs (the monoliths stay for the framework's own canary). eks-setup/eks-cleanup
      # are the shared once-per-pipeline App Signals lifecycle workflows, and java-eks-patch-java-operator
      # is the one-time operator-image patch gate — none of these are themselves *-test.yml suites.
      exclusions: 'java-eks-test.yml,java-eks-service-events-test.yml,eks-setup-app-signals.yml,eks-cleanup-app-signals.yml,java-eks-patch-java-operator.yml'
